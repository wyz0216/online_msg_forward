{% extends "base.html" %}
{% block title %}请输入分享密码{% endblock %}
{% block body %}
<section class="auth-panel">
  <p class="eyebrow">消息分享</p>
  <h1>请输入分享密码</h1>
  <p class="muted">该分享已设置密码，请向分享者获取密码后查看。</p>
  {% if password_error %}
  <p class="form-error" role="alert">{{ password_error }}</p>
  {% endif %}
  <form method="post" action="/s/{{ token }}/unlock" class="stack">
    <label for="share-password">分享密码</label>
    <input id="share-password" name="password" type="password" maxlength="128" autocomplete="current-password" required autofocus>
    <button type="submit">验证并打开</button>
  </form>
  <p class="field-hint">验证后，当前浏览器在 1 小时内无需重复输入密码。</p>
</section>
{% endblock %}
